<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vivien Andrei D. Maravilla | Portfolio</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== THEMES (edit colors here) ===== */
:root,[data-theme="red"]{--bg:#35171F;--card:rgba(247,242,236,.07);--tx:#F7F2EC;--mu:#CDB8B8;--ac:#8C3949;--hi:#E0A0AC;--on:#F7F2EC;--wv:#702632}
[data-theme="pink"]{--bg:#FBEFF1;--card:rgba(255,255,255,.7);--tx:#3A2429;--mu:#6E4E56;--ac:#A8556A;--hi:#8E3F55;--on:#fff;--wv:#D9A3B0}
[data-theme="mono"]{--bg:#191719;--card:rgba(255,255,255,.07);--tx:#F2F2F2;--mu:#A8A8A8;--ac:#E8E8E8;--hi:#fff;--on:#191719;--wv:#555}
[data-theme="elegance"]{--bg:#2A0F18;--card:rgba(213,173,107,.08);--tx:#F7F2EC;--mu:#CDBBA8;--ac:#D5AD6B;--hi:#D5AD6B;--on:#2A0F18;--wv:#702632}
[data-theme="midnight"]{--bg:#0E1B33;--card:rgba(143,180,232,.08);--tx:#EAF0FA;--mu:#9FB0CC;--ac:#2B4C85;--hi:#8FB4E8;--on:#fff;--wv:#2B4C85}
[data-theme="sage"]{--bg:#EEF1E8;--card:rgba(255,255,255,.7);--tx:#26332A;--mu:#55645A;--ac:#4F6F55;--hi:#3F5E45;--on:#fff;--wv:#9DB5A0}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--tx);font:400 clamp(.72rem,1.3vh + .28rem,.92rem)/1.45 Inter,system-ui,sans-serif;transition:background .5s,color .5s}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg i{position:absolute;border-radius:50%;filter:blur(80px);opacity:.28;background:var(--ac);animation:drift 22s ease-in-out infinite alternate}
.bg i:nth-child(1){width:42vw;height:42vw;left:-10vw;top:-12vw}
.bg i:nth-child(2){width:34vw;height:34vw;right:-8vw;bottom:-10vw;background:var(--hi);opacity:.16;animation-delay:-8s}
.bg i:nth-child(3){width:20vw;height:20vw;left:45vw;top:30vh;opacity:.12;animation-delay:-14s}
@keyframes drift{to{transform:translate(6vw,5vh) scale(1.15)}}
/* nav */
nav{position:fixed;top:0;left:0;right:0;z-index:20;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(12px,3vw,40px)}
.logo{font:600 1.5rem "Cormorant Garamond",serif;letter-spacing:.12em;padding:2px 10px;border:1.5px solid var(--hi);color:var(--hi);border-radius:2px 14px 2px 14px}
.links{display:flex;gap:clamp(2px,1.2vw,18px)}
.links button{padding:6px 10px;border-bottom:2px solid transparent;color:var(--mu);transition:.25s}
.links button:hover{color:var(--tx);transform:translateY(-2px)}
.links button.on{color:var(--tx);border-color:var(--hi)}
.tools{display:flex;gap:6px;position:relative}
.ib{width:34px;height:34px;border-radius:50%;border:1px solid var(--mu);display:grid;place-items:center;transition:.25s}
.ib:hover{background:var(--ac);color:var(--on);transform:rotate(25deg)}
#pan{position:absolute;right:0;top:42px;background:var(--bg);border:1px solid var(--mu);border-radius:12px;padding:12px;width:210px;display:none;box-shadow:0 12px 30px #0006}
#pan.open{display:block}
#pan p{font-size:.75rem;color:var(--mu);margin-bottom:8px}
.sw{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sw button{height:34px;border-radius:8px;border:2px solid transparent;outline:1px solid var(--mu)}
.sw button.sel{border-color:var(--tx);outline-color:var(--tx)}
.rs{margin-top:10px;width:100%;padding:6px;border:1px solid var(--mu);border-radius:8px}
/* slides */
main{position:fixed;inset:0;z-index:1}
.slide{position:absolute;inset:0;padding:64px clamp(14px,4vw,64px) 58px;opacity:0;visibility:hidden;transform:translateX(40px) scale(.985);transition:opacity .7s,transform .7s,visibility .7s}
.slide.on{opacity:1;visibility:visible;transform:none}
.slide.before{transform:translateX(-40px) scale(.985)}
.on .rv{animation:up .7s both;animation-delay:calc(var(--i)*70ms + 150ms)}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.card{background:var(--card);border:1px solid color-mix(in srgb,var(--mu) 30%,transparent);border-radius:14px;padding:clamp(8px,1.4vh,16px) clamp(10px,1.2vw,16px);backdrop-filter:blur(6px);min-height:0}
.card h3{font-size:1.25em;color:var(--hi);margin-bottom:4px}
.eyebrow{letter-spacing:.25em;text-transform:uppercase;font-size:.75em;color:var(--hi)}
.btn{display:inline-block;background:var(--ac);color:var(--on);padding:11px 26px;border-radius:40px;font-weight:500;transition:.25s}
.btn:hover{transform:translateY(-3px);box-shadow:0 10px 24px #0004}.btn:active{transform:scale(.97)}
/* home */
#s0{display:grid;grid-template-columns:1.05fr 1fr;align-items:center;gap:3vw}#s0>div:first-child{padding-left:clamp(0px,6.5vw,96px)}
#s0 h1{font-size:clamp(2.4rem,8vh + 1.8vw,5.2rem);line-height:1.02;margin:12px 0 18px}
#s0 .deg{color:var(--mu);margin-bottom:6px}
#s0 .tag{font:italic 500 clamp(1.2rem,3vh + .4rem,1.9rem) "Cormorant Garamond",serif;color:var(--hi);margin:6px 0 28px}
.portrait{justify-self:center;height:min(78vh,660px);aspect-ratio:3/4;border-radius:200px 200px 16px 16px;overflow:hidden;border:2px solid var(--hi);box-shadow:0 24px 60px #0005}
.portrait img,.ph img{width:100%;height:100%;object-fit:cover;display:block}
/* personal information */
#s1{display:grid;grid-template-columns:minmax(0,30%) minmax(0,1fr);gap:clamp(16px,3vw,48px);padding:64px clamp(14px,6vw,96px) 58px;font-size:clamp(.8rem,1.15vh + .42rem,1rem);line-height:1.5;align-items:stretch}
.ph{border-radius:14px;overflow:hidden;border:1px solid var(--hi);box-shadow:14px 14px 0 -2px color-mix(in srgb,var(--ac) 55%,transparent),0 14px 36px #0005;min-height:0;margin:0 14px 14px 0}
.ph img{object-position:62% 25%}
.pi{display:flex;flex-direction:column;justify-content:center;gap:clamp(12px,2.4vh,24px);min-height:0;min-width:0}
.pi .card{padding:clamp(14px,2.6vh,28px) clamp(18px,2.2vw,32px)}
.intro h2{font-size:clamp(1.9rem,4.6vh + .5rem,2.8rem);line-height:1.08;margin:0 0 clamp(8px,1.6vh,14px)}
.intro p{font-size:1.14em;line-height:1.7}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,2.2vh,22px) clamp(14px,2vw,28px)}
.facts div{min-width:0}
.facts small{display:block;font-size:.72em;letter-spacing:.14em;text-transform:uppercase;color:var(--hi);margin-bottom:2px}
.facts span{display:block;font-weight:500;font-size:1.04em;line-height:1.35;overflow-wrap:anywhere}
.facts a{color:inherit;text-decoration:none;border-bottom:1px dotted var(--hi)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{padding:3px 11px;border-radius:20px;border:1px solid var(--hi);font-size:.92em}
/* achievements page: academic journey. Everything visible at once, nothing hidden or clickable */
#s2{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;row-gap:clamp(8px,1.5vh,12px);padding:64px clamp(14px,5vw,80px) 58px;font-size:clamp(.8rem,1.1vh + .42rem,1rem);line-height:1.45}
.ph3{display:flex;align-items:center;gap:clamp(12px,1.6vw,22px)}
.tag3{border-left:3px solid var(--hi);padding:2px 0 2px 10px;font-size:.74em;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--hi);white-space:nowrap}
.ph3 h2{font-size:clamp(1.5rem,3.6vh + .4rem,2.2rem);line-height:1.1;margin:0}
.ph3 p{margin:0 0 0 auto;color:var(--mu);text-align:right;max-width:46ch}
.sh{display:flex;align-items:center;gap:10px;flex:none;margin-bottom:clamp(5px,1vh,8px)}
.sh .n{background:var(--hi);color:var(--on);padding:1px 7px;border-radius:3px;font-size:.74em;font-weight:700;letter-spacing:.08em}
.sh .t{font-size:.78em;font-weight:600;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
.sh i{flex:1;height:1px;background:color-mix(in srgb,var(--mu) 45%,transparent)}
/* education timeline: four stages, Senior High gets the most room */
.stages{position:relative;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1fr) minmax(0,1.9fr) minmax(0,1.1fr);gap:clamp(8px,1vw,14px);min-height:0}
.stages::before{content:"";position:absolute;left:6px;right:0;top:6px;height:2px;background:linear-gradient(90deg,var(--hi),color-mix(in srgb,var(--hi) 30%,transparent))}
.stg{position:relative;display:flex;flex-direction:column;min-height:0;min-width:0;padding-top:22px}
.stg::before{content:"";position:absolute;left:0;top:0;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--hi);z-index:1}
.stg.cur::before{background:var(--hi);box-shadow:0 0 0 4px color-mix(in srgb,var(--hi) 28%,transparent)}
.stc{flex:1;min-height:0;display:flex;flex-direction:column;gap:clamp(5px,1vh,9px);padding:clamp(8px,1.4vh,14px) clamp(10px,1vw,14px);border-radius:12px;background:var(--card);border:1px solid color-mix(in srgb,var(--mu) 30%,transparent);backdrop-filter:blur(6px)}
.stg.big .stc{border-color:color-mix(in srgb,var(--hi) 55%,transparent);box-shadow:0 12px 32px #0004}
.stg.cur .stc{border-color:var(--hi);box-shadow:0 0 0 1px color-mix(in srgb,var(--hi) 40%,transparent),0 10px 28px #0004}
.sth{display:flex;align-items:center;gap:clamp(8px,.9vw,12px)}
.logo-s{flex:none;width:clamp(42px,8vh,60px);aspect-ratio:1;border-radius:10px;overflow:hidden;background:#fff;border:1px solid color-mix(in srgb,var(--hi) 55%,transparent)}
.logo-s img{width:100%;height:100%;object-fit:contain;display:block}
.edt{min-width:0;flex:1}
.edt small{display:block;font-size:.72em;letter-spacing:.14em;text-transform:uppercase;color:var(--hi);margin-bottom:1px}
.edt b{display:block;font-weight:600;font-size:1.02em;line-height:1.25}
.yrs{display:inline-block;margin-top:3px;font-size:.88em;font-weight:600;color:var(--mu);font-variant-numeric:tabular-nums}
.stt{display:inline-block;margin-left:8px;font-size:.62em;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:1px 7px;border-radius:3px;background:var(--hi);color:var(--on);vertical-align:1px}
.kv small{display:block;font-size:.68em;letter-spacing:.14em;text-transform:uppercase;color:var(--hi)}
.kv span{display:block;font-weight:500;line-height:1.3}
.lbl{font-size:.68em;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--hi);margin:0 0 3px}
.lst{list-style:none;margin:0;padding:0;display:grid;gap:3px;font-size:.92em;line-height:1.35}
.hon li{display:grid;grid-template-columns:4.4em 1fr;gap:6px}
.hon .g{color:var(--hi);font-weight:600}
.aw li{position:relative;padding-left:13px}
.aw li::before{content:"◆";position:absolute;left:0;top:.2em;font-size:.55em;color:var(--hi)}
.aw b{font-weight:600}
.aw span{color:var(--mu)}
.pics{margin-top:auto;display:flex;gap:6px;align-items:flex-end;min-width:0}
.pics img{flex:0 1 auto;min-width:0;max-width:100%;height:var(--pic,clamp(56px,13vh,110px));object-fit:contain;object-position:left bottom;border-radius:6px}
.sth .pics{margin:0 0 0 auto;--pic:clamp(38px,7vh,54px)}
/* bottom strip: skills + extra recognition */
.btm{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:clamp(8px,1vw,14px)}
.pnl{padding:clamp(6px,1.1vh,10px) clamp(10px,1vw,14px) clamp(8px,1.2vh,12px);border-radius:12px;background:var(--card);border:1px solid color-mix(in srgb,var(--mu) 30%,transparent)}
.sg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,1vw,14px)}
.sg h4{font-size:.68em;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);margin:0 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips span{padding:2px 9px;border-radius:14px;border:1px solid var(--hi);font-size:.84em}
.rc{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.rc li{display:flex;gap:9px;align-items:flex-start;line-height:1.3}
.rc li::before{content:"★";flex:none;color:var(--hi);font-size:.9em;line-height:1.45}
.rc b{font-weight:600}
.rc small{display:block;color:var(--mu);font-size:.84em;line-height:1.3}
/* people */
#s3{display:flex;flex-direction:column;gap:1.2vh}
#s3 h1{font-size:clamp(1.5rem,4vh + .5rem,2.4rem)}
.gal{flex:1;min-height:0;display:flex;flex-direction:column}
.gh{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.gh h3{font-size:1.3em;color:var(--hi)}
.gh button{width:28px;height:28px;border-radius:50%;border:1px solid var(--mu);margin-left:4px}
.gh button:hover{background:var(--ac);color:var(--on)}
.gr{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.fig{min-width:0;min-height:0;display:flex;flex-direction:column;cursor:zoom-in}
.fig .im{aspect-ratio:16/9;max-height:100%;width:100%;overflow:hidden;border-radius:10px;border:1px solid color-mix(in srgb,var(--mu) 40%,transparent);transition:.3s}
.fig .im img{width:100%;height:100%;object-fit:cover;transition:.4s}
.fig:hover .im{transform:translateY(-3px);box-shadow:0 10px 24px #0005}.fig:hover img{transform:scale(1.05)}
.fig p{font-size:.8em;color:var(--mu);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* footer nav */
.foot{position:fixed;bottom:0;left:0;right:0;z-index:20;height:50px;display:flex;align-items:center;justify-content:center;gap:16px}
.foot .ib:hover{transform:scale(1.1)}
.cnt{font:600 1rem "Cormorant Garamond",serif;letter-spacing:.2em;min-width:60px;text-align:center}
/* wave: 3 layered ocean swells, each a wavy leading crest + body + wavy trailing edge (inline SVG, no masks) */
main.nt .slide{transition:none!important}
.w{position:fixed;left:0;right:0;top:0;z-index:50;pointer-events:none;display:none;will-change:transform;--c:var(--wv)}
.w .cr,.w .tr{height:110px;overflow:hidden}
.w .tr{transform:scaleY(-1)}
.w svg{display:block;height:110px;animation:sw var(--sp,1.6s) linear infinite;will-change:transform}
.w .tr svg{animation-direction:reverse}
.w .bd{background:var(--c);margin:-1px 0}
.w path{fill:var(--c)}
#w3{--c:color-mix(in srgb,var(--wv) 55%,var(--hi));--sz:760px;--sp:2.1s;opacity:.6}
#w2{--c:color-mix(in srgb,var(--wv) 75%,var(--ac));--sz:520px;--sp:1.4s;opacity:.85}
#w1{--c:var(--wv);--sz:640px;--sp:1.8s}
@keyframes sw{to{transform:translateX(calc(var(--sz,600px) * -1))}}
/* lightbox */
#lb{position:fixed;inset:0;z-index:60;background:#000d;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:20px}
#lb.open{display:flex}
#lb img{max-width:90vw;max-height:78vh;aspect-ratio:16/9;object-fit:contain;border-radius:8px;animation:up .35s}
#lb p{color:#fff}#lb .ib{color:#fff;border-color:#fff8;position:absolute}
.stars{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.stars b{position:absolute;display:block;opacity:.5;animation:tw var(--d,4s) ease-in-out var(--l,0s) infinite}
.stars b.g{filter:drop-shadow(0 0 4px color-mix(in srgb,var(--hi) 80%,transparent))}
.stars i{display:block;width:100%;height:100%;background:color-mix(in srgb,var(--tx) 82%,var(--hi));clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
#s0:not(.on) .stars b,#s1:not(.on) .stars b{animation-play-state:paused}
#s1 .stars{z-index:-1;bottom:auto}
#s0>.portrait,#s0>div:not(.stars){position:relative;z-index:1}
@keyframes tw{0%,100%{opacity:.12;transform:scale(.7) rotate(var(--r,0deg))}50%{opacity:var(--pk,1);transform:scale(1.2) rotate(var(--r,0deg))}}
@media(max-width:900px){
 #s0{grid-template-columns:1fr;justify-items:center;text-align:center;gap:1vh}.portrait{height:36vh;order:-1}
 #s1{grid-template-columns:1fr;grid-template-rows:auto auto;align-content:start;padding:64px 16px 58px}.pi{justify-content:flex-start}.pi .card,#s2 .card{flex-shrink:0}.ph{height:34vh;margin:0 0 12px}.facts{grid-template-columns:repeat(2,minmax(0,1fr))}
 #s2{display:flex;flex-direction:column;gap:14px;padding:64px 16px 58px}.ph3{flex-wrap:wrap}.ph3 p{display:none}.stages,.btm,.ph3{flex:none}.stages{grid-template-columns:1fr;gap:14px;min-height:auto}.stages::before{display:none}.stg{padding-top:0}.stg::before{display:none}.logo-s{width:56px}.btm{grid-template-columns:1fr}.sg{grid-template-columns:1fr}.pics img{--pic:90px}
 .gr{grid-template-columns:repeat(2,1fr)}.links button{padding:6px 5px;font-size:.78em}.logo{display:none}
 .slide{overflow:auto}}
@media(max-width:1100px) and (min-width:901px){#s2{display:flex;flex-direction:column;gap:12px;font-size:.76rem;overflow-y:auto}.stages,.btm,.ph3{flex:none}.stages{grid-template-columns:repeat(2,minmax(0,1fr));min-height:auto;align-items:stretch}.stg.big{grid-column:1/-1}.stages::before,.stg::before{display:none}.stg{padding-top:0}.ph3 p{display:none}.btm{grid-template-columns:1fr}}
@media(max-width:560px){.links button{font-size:.7em;padding:6px 3px}}
@media(max-height:760px) and (min-width:901px){#s1{padding-top:56px;padding-bottom:50px}#s2{padding-top:56px;padding-bottom:50px}.pi .card{padding:12px 20px}}
@media(max-height:680px) and (min-width:901px){#s1,#s2{font-size:.76rem;line-height:1.4}.intro p{line-height:1.55}.pi{gap:10px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
<nav>
 <div class="logo">VAM</div>
 <div class="links" id="links"></div>
 <div class="tools">
  <button class="ib" id="snd" aria-label="Toggle wave sound" title="Wave sound">♪</button>
  <button class="ib" id="gear" aria-label="Theme settings" title="Themes">⚙</button>
  <div id="pan"><p>Choose a theme</p><div class="sw" id="sw"></div><button class="rs" id="rs">Reset to Classic Red</button></div>
 </div>
</nav>
<main id="main"></main>
<div class="foot">
 <button class="ib" id="prev" aria-label="Previous page">←</button>
 <div class="cnt" id="cnt">01 / 04</div>
 <button class="ib" id="next" aria-label="Next page">→</button>
</div>
<div class="w" id="w3"><div class="cr"></div><div class="bd"></div><div class="tr"></div></div>
<div class="w" id="w2"><div class="cr"></div><div class="bd"></div><div class="tr"></div></div>
<div class="w" id="w1"><div class="cr"></div><div class="bd"></div><div class="tr"></div></div>
<div id="lb"><button class="ib" id="lx" style="top:16px;right:16px" aria-label="Close">✕</button><button class="ib" id="lp" style="left:16px;top:50%">←</button><button class="ib" id="ln" style="right:16px;top:50%">→</button><img id="li" alt=""><p id="lc"></p></div>

<script>
/* ===================== EDIT YOUR CONTENT HERE ===================== */
const SITE = {
  name: "Vivien Andrei D. Maravilla",
  course: "Bachelor of Science in Computer Science",

  tagline: "Learning, exploring, and creating possibilities.",
  portrait: "images/me.jpg",      // Home page formal portrait
  aboutPhoto: "images/about.jpg", // Personal Information photo
  intro: "First-year Computer Science student who is curious, determined, and eager to learn. I’m building my foundations in Python and Java. Outside class, I love baking, embroidery, painting, online games, and surfing, swimming, and traveling with my family. I aspire to become an adaptable, well-rounded person who sees challenges as chances to grow.",
  personal: [["Name","Vivien"],["Birthday","July 26, 2008"],["Age","18"],["Gender","Female"],["Status","Single"],["Weight","45 kg"],["Height","160 cm"],["Location","Rodriguez, Rizal, Philippines"],["College","University of the Cordilleras"],["Program","BS Computer Science"],["Year Level","First Year"],["Gmail","lalalovienna@gmail.com"]],

/* ---- twinkling stars (Home + Personal Information). Stars never land on text, buttons, photos or cards ---- */

function whoosh() {
  try {
    const A = new (window.AudioContext || window.webkitAudioContext)(), T = 1.7, len = A.sampleRate * T, buf = A.createBuffer(1, len, A.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = A.createBufferSource(); src.buffer = buf;
    const f = A.createBiquadFilter(); f.type = "lowpass"; f.frequency.setValueAtTime(300, A.currentTime); f.frequency.linearRampToValueAtTime(1100, A.currentTime + T / 2); f.frequency.linearRampToValueAtTime(300, A.currentTime + T);
    const g = A.createGain(); g.gain.setValueAtTime(0, A.currentTime); g.gain.linearRampToValueAtTime(.07, A.currentTime + T / 2); g.gain.linearRampToValueAtTime(0, A.currentTime + T);

/* Three swells rise from the bottom (crest edge travelling up), cover the page, the page is swapped

function swap(n) { const m = $("#main"); m.classList.add("nt"); cur = n; paint(); void m.offsetWidth; m.classList.remove("nt"); }
function crest(period) {
  const N = Math.ceil(innerWidth / period) + 2; let d = "M0 66";
  for (let i = 0; i < N; i++) { const o = i * 600; d += `C${o + 45} 66 ${o + 70} 14 ${o + 150} 14S${o + 255} 66 ${o + 300} 66 ${o + 370} 14 ${o + 450} 14 ${o + 555} 66 ${o + 600} 66`; }
  return `<svg viewBox="0 0 ${N * 600} 110" preserveAspectRatio="none" style="width:${N * period}px" aria-hidden="true"><path d="${d}V110H0Z"/></svg>`;
}
function wave(n) {
  busy = true; if (soundOn) whoosh();
  ["#w1", "#w2", "#w3"].forEach(id => { const el = $(id), sz = parseFloat(getComputedStyle(el).getPropertyValue("--sz")); el.querySelector(".cr").innerHTML = el.querySelector(".tr").innerHTML = crest(sz); });
  const H = innerHeight, CR = 110, BODY = H + 200, TOTAL = BODY + CR * 2;
  const start = H, mid = -(CR + 100), end = -TOTAL, DUR = 1300;
  const layers = [["#w3", 0], ["#w2", 80], ["#w1", 160]].map(([id, delay]) => {

    el.style.transform = `translateY(${start}px)`; el.style.display = "block";

  });

    doSwap(); layers.forEach(a => a.cancel());
    ["#w1", "#w2", "#w3"].forEach(id => { const el = $(id); el.style.display = "none"; el.style.transform = ""; });

}

/* Awards & Medals: its own row above the timeline, moving on its own */
.awrow{display:flex;align-items:center;gap:12px;flex:none;margin:2px 0 clamp(8px,1.4vh,14px);padding:6px 10px;border:1px solid color-mix(in srgb,var(--hi) 35%,transparent);border-radius:12px;background:color-mix(in srgb,var(--bg) 55%,transparent)}
.awlbl{flex:none;width:58px;font:600 9px/1.35 Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--hi)}
.awwin{flex:1;min-width:0;overflow:hidden;cursor:grab;touch-action:pan-y;user-select:none;height:clamp(64px,11vh,110px);-webkit-mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)}
.awtrack{display:flex;height:100%;width:max-content;will-change:transform}
.awtrack img{height:100%;width:auto;flex:none;object-fit:cover;border-radius:8px;box-shadow:0 6px 16px #0005;margin-right:10px;cursor:zoom-in;transition:transform .25s,filter .25s}
.awtrack img:hover,.awtrack img:focus-visible{transform:scale(.94);filter:brightness(1.12);outline:none}
/* chess & Girl Scout recognitions: four photo cards in the bottom-left panel (replaces Skills) */
.hl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(8px,.9vw,12px)}
.hlc{margin:0;display:flex;gap:9px;align-items:center;min-width:0;padding:6px;border-radius:10px;background:color-mix(in srgb,var(--bg) 35%,transparent);border:1px solid color-mix(in srgb,var(--hi) 25%,transparent)}
.hlc{cursor:zoom-in;transition:transform .25s,border-color .25s,background .25s}
.hlc:hover,.hlc:focus-visible{transform:translateY(-2px);border-color:color-mix(in srgb,var(--hi) 60%,transparent);background:color-mix(in srgb,var(--bg) 20%,transparent);outline:none}
.hlc img{transition:transform .25s}.hlc:hover img{transform:scale(1.06)}
.hlc img{flex:none;width:clamp(48px,4.6vw,72px);aspect-ratio:1;object-fit:cover;border-radius:7px;box-shadow:0 4px 10px #0004}
.hlc figcaption{min-width:0;display:grid;gap:2px}
.hlc b{font-size:.84em;line-height:1.25}
.hlc small{font-size:.72em;line-height:1.3;color:var(--mu)}
@media(max-width:1100px){.hl{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* each school's photo behind its box; a veil in the current theme colour keeps the text readable */
.stc.has-bg{background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 40%,transparent) 0%,color-mix(in srgb,var(--bg) 62%,transparent) 35%,color-mix(in srgb,var(--bg) 78%,transparent) 65%,color-mix(in srgb,var(--bg) 88%,transparent) 100%),var(--stg-bg) center 35%/cover no-repeat}
.stc.has-bg small,.stc.has-bg b,.stc.has-bg span,.stc.has-bg .lbl,.stc.has-bg li{text-shadow:0 0 2px var(--bg),0 0 6px var(--bg),0 1px 10px var(--bg)}
@media(min-width:901px){#s2{grid-template-rows:auto auto minmax(0,1fr) auto!important}.awrow{margin:0}}
@media(max-height:760px) and (min-width:901px){.awwin{height:clamp(50px,8.5vh,72px)}.awrow{padding:4px 8px}}
@media(min-width:901px){.awwin{height:clamp(46px,7.5vh,90px)}.stg:not(.big) .pics img{--pic:clamp(40px,8vh,96px)}}
@media(max-height:760px) and (min-width:901px){.awwin{height:clamp(40px,6.6vh,56px)!important}.awrow{padding:3px 8px!important}.awlbl{font-size:8px}}
.awwin.dragging,.awwin.dragging img{cursor:grabbing}
/* bigger moving award photos (about 1.5x) */
.awwin{height:clamp(90px,16vh,160px)}
@media(min-width:901px){.awwin{height:clamp(64px,11.5vh,135px)!important}}
@media(max-height:760px) and (min-width:901px){.awwin{height:clamp(54px,9.5vh,80px)!important}}
/* Vien's own photo in each school box: bottom of Elementary / Junior High, top-right of Senior High (click = bigger) */
.stg-me{margin:0;cursor:zoom-in;overflow:hidden;border-radius:10px;border:2px solid color-mix(in srgb,var(--hi) 70%,transparent);box-shadow:0 10px 24px #0006;background:#0006;transition:transform .25s,box-shadow .25s}
.stg-me img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 25%}
.stg-me:hover,.stg-me:focus-visible{transform:scale(1.04);box-shadow:0 0 0 2px var(--hi),0 14px 30px #0008;outline:none}
.stg:not(.big) .stc>.stg-me{margin-top:auto;align-self:center;flex:1 1 auto;min-height:clamp(46px,8vh,120px);max-height:clamp(140px,30vh,300px);aspect-ratio:4/5;width:auto;max-width:78%}
.stg.big .stc{position:relative}
.stg.big .sth .stg-me{position:absolute;top:clamp(8px,1.4vh,14px);right:clamp(10px,1vw,14px);z-index:2;width:clamp(96px,min(10.5vw,21vh),210px);aspect-ratio:4/5}
.stg.big .sth,.stg.big .stc>.kv,.stg.big .stc>div:has(.hon){padding-right:calc(clamp(96px,min(10.5vw,21vh),210px) + 14px)}
.stg.big .sth{align-items:flex-start}

.stg.cur .stc>.stg-me{aspect-ratio:600/881;max-width:82%}
.stg.cur .stc>.stg-me img{object-fit:contain;background:#0008}
/* all four photo frames: one shared size (the biggest that fits in every box), set by sizeMe() below */
#s2 .stg .stc>.stg-me,#s2 .stg.big .sth .stg-me{width:var(--me-w,110px)!important;height:var(--me-h,138px)!important;max-width:none!important;max-height:none!important;min-height:0!important;aspect-ratio:auto!important;flex:none!important}
#s2 .stg.big .sth,#s2 .stg.big .stc>.kv,#s2 .stg.big .stc>div:has(.hon){padding-right:calc(var(--me-w,110px) + 14px)!important}
#s2 .stg.cur .stc>.stg-me img{object-fit:cover;object-position:50% 0%}
</style>
<script>
/* timeline cards: if a card's content is taller than its box, shrink its text a little (never below 72%) */
(function(){
 function fitCards(){if(innerWidth<=900)return;document.querySelectorAll('#s2 .stg .stc').forEach(function(c){c.style.fontSize='';var f=1;
  while(c.scrollHeight>c.clientHeight+1&&f>0.64){f-=0.02;c.style.fontSize=f+'em'}})}
 var t;function soon(){clearTimeout(t);t=setTimeout(fitCards,80)}
 addEventListener('load',function(){setTimeout(fitCards,350)});addEventListener('resize',soon);
 document.addEventListener('click',function(){setTimeout(fitCards,700)});document.addEventListener('keydown',function(){setTimeout(fitCards,700)});
 window._fitCards=fitCards;
 /* one size for all school photos: hide them, let the text settle, measure the free space in every box,
    take the smallest (so it fits everywhere), then show them all at that size (4:5 frames) */
 function sizeMe(){var root=document.getElementById('s2');if(!root)return;var figs=[].slice.call(root.querySelectorAll('.stg-me'));if(!figs.length)return;
  if(innerWidth<=900){root.style.removeProperty('--me-w');root.style.removeProperty('--me-h');return}
  for(var pass=0;pass<2;pass++){
   figs.forEach(function(f){f.style.display='none'});fitCards();
   var H=1e9;
   root.querySelectorAll('.stg .stc').forEach(function(c){var me=c.querySelector('.stg-me');if(!me)return;var cs=getComputedStyle(c),r=c.getBoundingClientRect(),pt=parseFloat(cs.paddingTop),pb=parseFloat(cs.paddingBottom);
    if(c.closest('.stg.big')){var aw=c.querySelector('.lst.aw');var lim=aw?aw.parentElement.getBoundingClientRect().top:r.bottom;
     H=Math.min(H,lim-r.top-pt-10,(c.clientWidth*0.36)*5/4)}
    else{var last=0;[].forEach.call(c.children,function(k){if(k!==me&&k.offsetParent!==null)last=Math.max(last,k.getBoundingClientRect().bottom)});
     H=Math.min(H,r.bottom-pb-last-12,(c.clientWidth*0.86)*5/4)}});
   H=Math.max(56,Math.floor(H));
   root.style.setProperty('--me-h',H+'px');root.style.setProperty('--me-w',Math.floor(H*0.8)+'px');
   figs.forEach(function(f){f.style.display=''});
  }
  fitCards()}
 window._sizeMe=sizeMe;
 var t2;function soon2(){clearTimeout(t2);t2=setTimeout(sizeMe,120)}
 addEventListener('load',function(){setTimeout(sizeMe,450)});addEventListener('resize',soon2);
 document.addEventListener('click',function(){setTimeout(sizeMe,750)});document.addEventListener('keydown',function(){setTimeout(sizeMe,750)});
})();
/* awards row: an endless, gap-free loop. Waits for every photo to load, measures one full set,
   repeats the set until it covers the window twice, then slides by exactly one set width forever */
(function(){
 var tr,orig=[],setW=0,x=0,last=0,speed=45;
 function ready(img){return img.complete?Promise.resolve():new Promise(function(r){img.onload=img.onerror=r})}
 function layout(){if(!tr)return;
  [].slice.call(tr.querySelectorAll('img[aria-hidden]')).forEach(function(c){c.remove()});
  setW=tr.scrollWidth;if(!setW)return;var win=tr.parentNode.clientWidth,n=Math.ceil(win/setW)+1;
  for(var k=0;k<n;k++)orig.forEach(function(i){var c=i.cloneNode(true);c.alt='';c.setAttribute('aria-hidden','true');tr.appendChild(c)});
  x=x%setW}
 var held=0,hold=false,drag=null,over=false;
 function wrap(){x=((x%setW)+setW)%setW}
 function pause(){held=performance.now()+1800} /* auto flow resumes 1.8s after she stops scrolling */
 function step(t){if(last&&setW){if(!hold&&!over&&t>held)x+=(t-last)/1000*speed;wrap();tr.style.transform='translate3d('+(-x)+'px,0,0)'}last=t;requestAnimationFrame(step)}
 function controls(){var win=tr.parentNode;
  win.addEventListener('wheel',function(e){var d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;if(!d)return;
   e.preventDefault();e.stopPropagation();x+=d*(e.deltaMode===1?30:1);wrap();pause()},{passive:false});
  win.addEventListener('pointerdown',function(e){if(e.button)return;drag={sx:e.clientX,x0:x,moved:false,id:e.pointerId};hold=true});
  addEventListener('pointermove',function(e){if(!drag)return;var dx=e.clientX-drag.sx;if(Math.abs(dx)>5&&!drag.moved){drag.moved=true;win.setPointerCapture&&win.setPointerCapture(drag.id);win.classList.add('dragging')}
   if(drag.moved){x=drag.x0-dx;wrap()}});
  function end(){if(!drag)return;window.__awDragged=drag.moved;setTimeout(function(){window.__awDragged=false},50);drag=null;hold=false;win.classList.remove('dragging');pause()}
  addEventListener('pointerup',end);addEventListener('pointercancel',end);
  /* cursor on the Awards & Medals box = stopped; cursor leaves = moves again right away */
  var box=win.closest('.awrow')||win;
  box.addEventListener('pointerenter',function(e){if(e.pointerType==='mouse')over=true});
  box.addEventListener('pointerleave',function(e){if(e.pointerType==='mouse'){over=false;held=0}});win.addEventListener('dragstart',function(e){e.preventDefault()})}
 function start(){tr=document.querySelector('.awtrack');if(!tr)return;
  Promise.all([].slice.call(tr.querySelectorAll('img')).map(ready)).then(function(){
   orig=[].slice.call(tr.querySelectorAll('img')).filter(function(i){return i.isConnected});layout();controls();
   if(matchMedia('(prefers-reduced-motion: reduce)').matches)speed=0;requestAnimationFrame(step)})}
 var rt;addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(layout,150)});
 document.addEventListener('visibilitychange',function(){last=0});
 if(document.readyState==='complete')start();else addEventListener('load',start);
})();
/* build the sliding strip once the photos have loaded (missing ones remove themselves first) */
(function(){
 function build(){document.querySelectorAll('.stg.big .sth .pics').forEach(function(box){
  if(box.querySelector('.ptrack'))return;var imgs=[].slice.call(box.querySelectorAll('img'));if(!imgs.length)return;
  var tr=document.createElement('div');tr.className='ptrack';imgs.forEach(function(i){tr.appendChild(i)});
  imgs.forEach(function(i){var c=i.cloneNode(true);c.alt='';c.setAttribute('aria-hidden','true');tr.appendChild(c)});
  box.appendChild(tr);var w=tr.scrollWidth/2;tr.style.setProperty('--pd',Math.max(18,w/40)+'s')})}
 if(document.readyState==='complete')setTimeout(build,300);else addEventListener('load',function(){setTimeout(build,300)});
})();
</script>
</body>
